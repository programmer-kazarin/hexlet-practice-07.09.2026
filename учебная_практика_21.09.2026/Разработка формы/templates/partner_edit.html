<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM: Карточка партнера [Редактирование]</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='resources/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="app-header">
        <img src="{{ url_for('static', filename='resources/logo.png') }}" alt="Логотип компании" class="app-logo">
        <h1 class="app-title">Карточка партнера — Редактирование</h1>
    </header>

    <main class="form-wrapper">
        <form class="partner-form" id="partnerForm">

            <!-- Скрытый ID передается между MainWindow и PartnerEditWindow при переходе в режим редактирования -->
            <input type="hidden" name="partner_id" id="partnerId" value="">

            <label class="form-label" for="companyName">Наименование</label>
            <input class="form-input" type="text" id="companyName" name="company_name"
                   placeholder="Название компании" required>

            <label class="form-label" for="partnerType">Тип партнера</label>
            <!-- Строго ComboBox по ТЗ: пользователь не может ввести произвольное значение, только выбор из списка -->
            <select class="form-input" id="partnerType" name="partner_type" required>
                <option value="" disabled selected>Выберите тип</option>
                <option value="ООО">ООО</option>
                <option value="ЗАО">ЗАО</option>
                <option value="ОАО">ОАО</option>
                <option value="ИП">ИП</option>
                <option value="ТК">ТК</option>
            </select>

            <label class="form-label" for="rating">Рейтинг</label>
            <input class="form-input" type="number" id="rating" name="rating"
                   min="0" step="1" placeholder="0" title="Целое неотрицательное число">

            <label class="form-label" for="address">Адрес</label>
            <input class="form-input" type="text" id="address" name="address"
                   placeholder="Город, улица, дом">

            <label class="form-label" for="directorName">ФИО директора</label>
            <input class="form-input" type="text" id="directorName" name="director_name"
                   placeholder="Иванов Иван Иванович">

            <label class="form-label" for="phone">Телефон компании</label>
            <input class="form-input" type="tel" id="phone" name="phone"
                   placeholder="+7 (___) ___-__-__"
                   pattern="^\+7\s?$?\d{3}$?\s?\d{3}-?\d{2}-?\d{2}$"
                   title="Формат: +7 (999) 123-45-67">

            <label class="form-label" for="companyEmail">Email компании</label>
            <input class="form-input" type="email" id="companyEmail" name="company_email"
                   placeholder="info@company.ru"
                   title="Введите действующий email, например info@company.ru">

            <div class="form-actions">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Назад</a>
                <button type="submit" class="btn btn-primary" id="saveButton">
                    Сохранить
                </button>
            </div>
        </form>
    </main>

    <script src="{{ url_for('static', filename='partner_form.js') }}"></script>
</body>
</html>
